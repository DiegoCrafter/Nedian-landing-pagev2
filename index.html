      }
    },

      "@type": "Question",

      }
    },

      "acceptedAnswer": {
        "@type": "Answer",

      }
    },
    {
      "@type": "Question",
      "name": "¿Atienden proyectos fuera de Ayacucho?",
      "acceptedAnswer": {
        "@type": "Answer",

    {
      "@type": "Question",
      "name": "¿Cómo solicito una cotización gratuita?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Contáctanos por WhatsApp, teléfono o el formulario del sitio. Un especialista se comunicará contigo el mismo día, visitaremos el terreno si es necesario y recibirás tu presupuesto sin costo ni compromiso."
      }
    }
